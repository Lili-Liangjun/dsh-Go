# Builds a patched dsh-Go APK (with the sync panel) on GitHub's Linux runners.
# Single-file version: the patch script is inlined, no extra files needed.
# AGPL-3.0: distributing the result means publishing the modified sources.
name: Build patched APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patched-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "platform-tools" > /dev/null

      - name: Restore runtime download cache
        uses: actions/cache@v4
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-

      - name: Build the bundled arm64 runtime
        run: runtime/build-runtime.sh arm64-v8a

      - name: Check the runtime bundle
        run: python3 -I tooling/check_runtime_bundle.py arm64

      - name: Apply the sync panel patch
        run: |
          python3 - <<'PY'
          import os

          app = "app"
          entry = os.path.join(app, "lib/ui/web/sync_entry.dart")
          os.makedirs(os.path.dirname(entry), exist_ok=True)
          with open(entry, "w", encoding="utf-8") as handle:
              handle.write('''import 'package:flutter/material.dart';

          import 'web_view_page.dart';

          /// Base URL of the bridge plugin that serves the sync panel.
          const String kSyncPanelBase = 'http://192.168.5.4:8080';

          String syncPanelUrl([String base = kSyncPanelBase]) {
            final root = base.endsWith('/') ? base.substring(0, base.length - 1) : base;
            return '$root/__gateway/page';
          }

          /// The bridge's sync panel: conversations + running tasks of the desktop host.
          class SyncPanelPage extends StatelessWidget {
            const SyncPanelPage({super.key, this.base = kSyncPanelBase});

            final String base;

            @override
            Widget build(BuildContext context) {
              return WebViewPage(
                url: Uri.parse(syncPanelUrl(base)),
                title: '同步',
                subtitle: '会话与任务',
                allowOpenExternal: true,
                phoneLayout: true,
              );
            }
          }
          ''')
          print("wrote", entry)

          handle_file = os.path.join(app, "lib/ui/web/web_handle.dart")
          with open(handle_file, encoding="utf-8") as stream:
              text = stream.read()

          if "sync_entry.dart" not in text:
              lines = text.split("\n")
              last_import = max(index for index, line in enumerate(lines) if line.startswith("import "))
              lines.insert(last_import + 1, "import 'sync_entry.dart';")
              text = "\n".join(lines)

          tile = """              SettingsTile(
                          key: const ValueKey('web-handle-sync'),
                          icon: Icons.sync_rounded,
                          tinted: false,
                          title: '同步到电脑',
                          onTap: () {
                            navigator.pop();
                            push(const SyncPanelPage());
                          },
                        ),
          """

          if "web-handle-sync" not in text:
              anchor = """              SettingsTile(
                          key: const ValueKey('web-handle-host'),"""
              if anchor not in text:
                  raise SystemExit("anchor not found in web_handle.dart")
              text = text.replace(anchor, tile + anchor, 1)

          with open(handle_file, "w", encoding="utf-8") as stream:
              stream.write(text)
          print("patched", handle_file)
          PY

      - name: Resolve Dart dependencies
        working-directory: app
        run: flutter pub get

      - name: Build the APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Collect the APK
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk "out/dsh-go-patched-arm64.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-patched-apk
          path: out/dsh-go-patched-arm64.apk
          if-no-files-found: error
