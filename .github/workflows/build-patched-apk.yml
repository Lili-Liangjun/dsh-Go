# Builds a patched dsh-Go APK (with the sync panel) on GitHub's Linux runners.
# Single-file version: the patch script is inlined, no extra files needed.
# The sync panel address is asked for in the app and remembered between runs.
# AGPL-3.0: distributing the result means publishing the modified sources.
name: Build patched APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patched-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # The runner image already carries the Android SDK; only the extra build tools are added.
      - name: Install Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          ls "$ANDROID_HOME/build-tools"

      # libtawcroot.so is pinned to NDK 28.2.13676358 and the release build fails without it.
      - name: Install NDK 28.2.13676358
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp/ndk-extract
          sudo mkdir -p "$SDK/ndk"
          sudo rm -rf "$SDK/ndk/28.2.13676358"
          sudo mv /tmp/ndk-extract/android-ndk-r28c "$SDK/ndk/28.2.13676358"
          grep Pkg.Revision "$SDK/ndk/28.2.13676358/source.properties"
          test -x "$SDK/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Restore runtime download cache
        uses: actions/cache@v4
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-

      - name: Build the bundled arm64 runtime
        run: runtime/build-runtime.sh arm64-v8a

      - name: Check the runtime bundle
        run: python3 -I tooling/check_runtime_bundle.py arm64

      - name: Apply the sync panel patch
        run: |
          python3 - <<'PY'
          import os

          app = "app"
          entry = os.path.join(app, "lib/ui/web/sync_entry.dart")
          os.makedirs(os.path.dirname(entry), exist_ok=True)
          with open(entry, "w", encoding="utf-8") as handle:
              handle.write('''import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'web_view_page.dart';

          /// Fallback address of the bridge that serves the sync panel.
          const String kDefaultSyncPanelBase = 'http://192.168.5.4:8080';
          const String kSyncPanelBaseKey = 'sync_panel_base';

          String syncPanelUrl(String base) {
            final root = base.endsWith('/') ? base.substring(0, base.length - 1) : base;
            return '$root/__gateway/page';
          }

          /// The bridge's sync panel: conversations + running tasks of the desktop host.
          class SyncPanelPage extends StatelessWidget {
            const SyncPanelPage({super.key, required this.base});

            final String base;

            @override
            Widget build(BuildContext context) {
              return WebViewPage(
                url: Uri.parse(syncPanelUrl(base)),
                title: '同步',
                subtitle: base,
                allowOpenExternal: true,
                phoneLayout: true,
              );
            }
          }

          /// Asks for the bridge address (remembered between runs), then opens the panel.
          Future<void> openSyncPanel(BuildContext context) async {
            final prefs = await SharedPreferences.getInstance();
            final controller = TextEditingController(
              text: prefs.getString(kSyncPanelBaseKey) ?? kDefaultSyncPanelBase,
            );
            if (!context.mounted) {
              controller.dispose();
              return;
            }
            final base = await showDialog<String>(
              context: context,
              builder: (dialogContext) => AlertDialog(
                title: const Text('同步面板地址'),
                content: TextField(
                  controller: controller,
                  autofocus: true,
                  keyboardType: TextInputType.url,
                  decoration: const InputDecoration(hintText: 'http://192.168.5.4:8080'),
                ),
                actions: [
                  TextButton(onPressed: () => Navigator.pop(dialogContext), child: const Text('取消')),
                  FilledButton(
                    onPressed: () => Navigator.pop(dialogContext, controller.text.trim()),
                    child: const Text('打开'),
                  ),
                ],
              ),
            );
            controller.dispose();
            if (base == null || base.isEmpty) return;
            await prefs.setString(kSyncPanelBaseKey, base);
            if (!context.mounted) return;
            await Navigator.of(context).push(
              MaterialPageRoute<void>(builder: (_) => SyncPanelPage(base: base)),
            );
          }
          ''')
          print("wrote", entry)

          handle_file = os.path.join(app, "lib/ui/web/web_handle.dart")
          with open(handle_file, encoding="utf-8") as stream:
              text = stream.read()

          if "sync_entry.dart" not in text:
              lines = text.split("\n")
              last_import = max(index for index, line in enumerate(lines) if line.startswith("import "))
              lines.insert(last_import + 1, "import 'sync_entry.dart';")
              text = "\n".join(lines)

          tile = """              SettingsTile(
                          key: const ValueKey('web-handle-sync'),
                          icon: Icons.sync_rounded,
                          tinted: false,
                          title: '同步到电脑',
                          onTap: () {
                            navigator.pop();
                            unawaited(openSyncPanel(navigator.context));
                          },
                        ),
          """

          if "web-handle-sync" not in text:
              anchor = """              SettingsTile(
                          key: const ValueKey('web-handle-host'),"""
              if anchor not in text:
                  raise SystemExit("anchor not found in web_handle.dart")
              text = text.replace(anchor, tile + anchor, 1)

          with open(handle_file, "w", encoding="utf-8") as stream:
              stream.write(text)
          print("patched", handle_file)
          PY

      - name: Resolve Dart dependencies
        working-directory: app
        run: flutter pub get

      # The project has arm64 / x64 build flavors and hangs the runtime assets on them;
      # its own script picks the flavor, the build number and the runtime bundle.
      - name: Build the APK
        run: tooling/build-apk.sh --no-companion

      - name: Collect the APK
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-arm64-release.apk "out/dsh-go-patched-arm64.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-patched-apk
          path: out/dsh-go-patched-arm64.apk
          if-no-files-found: error
